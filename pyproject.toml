[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nika-core"
version = "0.0.2"
description = "Accessible Windows-first modular multi-agent platform"
requires-python = ">=3.12,<3.14"
dependencies = [
  "platformdirs>=4,<5",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "httpx>=0.28,<1",
  "pypdf>=6.14,<7",
  "python-docx>=1.2,<2",
  "openpyxl>=3.1.5,<4",
  "defusedxml>=0.7.1,<1",
  "sounddevice==0.5.6; sys_platform == 'win32'",
]

[project.scripts]
nika-peft-trainer = "nika_core.training_peft_worker:main"
nika-peft-physical-pilot = "nika_core.training_physical_pilot_driver:main"
nika-peft-physical-evaluation = "nika_core.training_physical_evaluation_driver:main"

[project.optional-dependencies]
agent = [
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "aiosqlite>=0.20,<1",
  "deepagents>=0.5.2,<1",
  "litellm>=1,<2",
  "apscheduler>=3.11,<4",
  "psutil>=7,<8",
  "mcp>=2,<3",
]
# Compatibility extra retained for existing install commands. OpenHands runs in a
# separately provisioned Agent Server; no OpenHands/FastMCP packages enter Nika.
coding-openhands = []
embedded-ai = [
  "foundry-local-sdk-winml>=1.2.3,<2; sys_platform == 'win32'",
  "foundry-local-sdk>=1.2.3,<2; sys_platform != 'win32'",
]
planning = ["unified-planning>=1.3,<2", "up-aries==0.5.0"]
gui = ["pywebview>=6.2.1,<7"]
browser = ["playwright>=1.60,<2"]
windows-interaction = ["pywinauto>=0.6.8,<0.7; sys_platform == 'win32'"]
learning = ["dspy>=3,<4", "scikit-learn>=1.7,<2"]
training = [
  "psutil>=7,<8",
  "torch>=2.14,<3",
  "transformers>=5.18,<6",
  "peft>=0.21.2,<1",
  "accelerate>=1.15,<2",
  "gguf>=0.19,<1",
  "safetensors>=0.8,<1",
]
media = [
  "yt-dlp==2026.7.4",
  "pysubs2==1.8.1",
]
voice = [
  "numpy>=2,<3",
  "sherpa-onnx==1.13.8",
]
credentials = [
  "keyring==25.7.0; sys_platform == 'win32'",
  "pywin32-ctypes==0.2.3; sys_platform == 'win32'",
]
deployment = ["ansible-runner==2.4.3; sys_platform != 'win32'"]
dev = ["pytest>=8,<9", "ruff>=0.12,<1", "pytest-cov>=6,<8"]
qa = ["pip-audit>=2,<3", "pyinstaller>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"src/nika_core/product_factory_windows_credentials.py" = ["BLE001"]
"tests/test_product_factory_windows_credentials.py" = ["DTZ001"]
