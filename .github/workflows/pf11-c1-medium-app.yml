name: PF11 C1 Medium App Acceptance

on:
  pull_request:
    paths:
      - "src/nika_core/product_factory_c1_acceptance.py"
      - "scripts/pf11_c1_medium_app.py"
      - "tests/test_product_factory_c1_acceptance.py"
      - ".github/workflows/pf11-c1-medium-app.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NIKA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: pf11-c1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  c1-medium-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.NIKA_CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify exact candidate checkout identity
        run: python scripts/qa_assert_checkout_identity.py
      - name: Install factory, packaging and test dependencies
        run: python -m pip install -e ".[gui,qa,dev]"
      - name: Run C1 source quality and acceptance
        shell: pwsh
        run: |
          python -m ruff check src/nika_core/product_factory_c1_acceptance.py scripts/pf11_c1_medium_app.py tests/test_product_factory_c1_acceptance.py
          python -m pytest tests/test_product_factory_c1_acceptance.py -vv
      - name: Build and prove generated medium Windows ProductProject
        shell: pwsh
        run: >-
          python scripts/pf11_c1_medium_app.py
          --root ./build/pf11-c1
          --source-sha '${{ env.NIKA_CANDIDATE_SHA }}'
          --evidence ./dist/pf11-c1-medium-app-evidence.json
          --windows-package
      - name: Re-prove exact generated C1 ZIP
        shell: pwsh
        run: |
          $evidencePath = [System.IO.Path]::GetFullPath('./dist/pf11-c1-medium-app-evidence.json')
          $evidence = Get-Content -LiteralPath $evidencePath -Raw | ConvertFrom-Json
          $package = [System.IO.Path]::GetFullPath([string]$evidence.package_path)
          if (-not (Test-Path -LiteralPath $package -PathType Leaf)) {
            throw "C1 exact package is missing: $package"
          }
          $actualSha = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha -ne [string]$evidence.package_sha256) {
            throw 'C1 exact package SHA-256 differs from recorded evidence.'
          }

          $extractRoot = Join-Path $env:RUNNER_TEMP 'Nika C1 — exact ZIP'
          $installRoot = Join-Path $env:RUNNER_TEMP 'Nika C1 — installed from exact ZIP'
          $dataRoot = Join-Path $env:RUNNER_TEMP 'Nika C1 — exact ZIP data'
          foreach ($path in @($extractRoot, $installRoot, $dataRoot)) {
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force
            }
          }
          New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
          Expand-Archive -LiteralPath $package -DestinationPath $extractRoot -Force

          $bundle = Join-Path $extractRoot 'NikaC1ExpenseManager'
          $installer = Join-Path $bundle 'install.ps1'
          $packagedExe = Join-Path $bundle 'NikaC1ExpenseManager.exe'
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw 'Exact C1 ZIP does not contain its installer.'
          }
          if (-not (Test-Path -LiteralPath $packagedExe -PathType Leaf)) {
            throw 'Exact C1 ZIP does not contain its executable.'
          }

          & $installer -BundlePath $bundle -Destination $installRoot | Out-Host
          $installedExe = Join-Path $installRoot 'NikaC1ExpenseManager.exe'
          if (-not (Test-Path -LiteralPath $installedExe -PathType Leaf)) {
            throw 'Exact C1 ZIP installer did not materialize its executable.'
          }

          New-Item -ItemType Directory -Path $dataRoot -Force | Out-Null
          $database = Join-Path $dataRoot 'expenses.db'
          $outputs = @()
          foreach ($attempt in 1,2) {
            $proof = Join-Path $dataRoot "proof-$attempt.txt"
            & $installedExe --self-test $database $proof
            if ($LASTEXITCODE -ne 0) {
              throw "Exact C1 ZIP installed executable self-test failed on attempt $attempt."
            }
            if (-not (Test-Path -LiteralPath $proof -PathType Leaf)) {
              throw "Exact C1 ZIP installed executable omitted proof $attempt."
            }
            $outputs += (Get-Content -LiteralPath $proof -Raw).Trim()
          }
          if (($outputs -join ',') -ne '1,1') {
            throw "Exact C1 ZIP restart proof changed durable row count: $($outputs -join ',')"
          }

          $exactEvidence = [ordered]@{
            schema = 'nika-pf11-c1-exact-package-evidence-v1'
            source_sha = '${{ env.NIKA_CANDIDATE_SHA }}'
            package_file = [System.IO.Path]::GetFileName($package)
            package_sha256 = $actualSha
            factory_evidence_sha256 = (Get-FileHash -LiteralPath $evidencePath -Algorithm SHA256).Hash.ToLowerInvariant()
            installer_sha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
            installed_executable_sha256 = (Get-FileHash -LiteralPath $installedExe -Algorithm SHA256).Hash.ToLowerInvariant()
            proof_scope = 'exact-generated-zip-after-extract-install'
            installed_executable_proven = $true
            packaged_restart_proven = $true
            restart_outputs = @($outputs)
            human_tested = $false
            nvda_verified = $false
            production_release_ready = $false
          }
          $exactEvidencePath = [System.IO.Path]::GetFullPath('./dist/pf11-c1-exact-package-evidence.json')
          $exactEvidence | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $exactEvidencePath -Encoding utf8
      - name: Verify evidence is fail-safe about human accessibility status
        shell: pwsh
        run: |
          $evidence = Get-Content ./dist/pf11-c1-medium-app-evidence.json -Raw | ConvertFrom-Json
          if ($evidence.human_tested -ne $false) { throw 'C1 evidence may not claim HUMAN_TESTED' }
          if ($evidence.nvda_verified -ne $false) { throw 'C1 evidence may not claim NVDA_VERIFIED' }
          if ($evidence.production_release_ready -ne $false) { throw 'C1 evidence may not claim production release readiness' }
          if ($evidence.installed_executable_proven -ne $true) { throw 'C1 installer proof is missing' }
          if ($evidence.packaged_restart_proven -ne $true) { throw 'C1 packaged restart proof is missing' }
          if ($evidence.restart_recovery_proven -ne $true) { throw 'C1 factory restart recovery proof is missing' }
          if ($evidence.all_components_accepted -ne $true) { throw 'C1 component acceptance is incomplete' }
          if ($evidence.package_sha256.Length -ne 64) { throw 'C1 package SHA-256 is missing' }
          if ($evidence.research_package_id -ne 'c1-research-local-windows-v1') { throw 'C1 research handoff proof is missing' }
          if ($evidence.selected_option_id -ne 'local-tk-sqlite') { throw 'C1 selected product option proof is missing' }

          $exact = Get-Content ./dist/pf11-c1-exact-package-evidence.json -Raw | ConvertFrom-Json
          if ($exact.schema -ne 'nika-pf11-c1-exact-package-evidence-v1') { throw 'Exact C1 package evidence schema is invalid' }
          if ($exact.source_sha -ne '${{ env.NIKA_CANDIDATE_SHA }}') { throw 'Exact C1 package evidence source SHA is stale' }
          if ($exact.package_sha256 -ne [string]$evidence.package_sha256) { throw 'Exact C1 package evidence is not bound to Factory package SHA' }
          if ($exact.proof_scope -ne 'exact-generated-zip-after-extract-install') { throw 'Exact C1 package proof scope is invalid' }
          if ($exact.installed_executable_proven -ne $true) { throw 'Exact C1 package install proof is missing' }
          if ($exact.packaged_restart_proven -ne $true) { throw 'Exact C1 package restart proof is missing' }
          if (($exact.restart_outputs -join ',') -ne '1,1') { throw 'Exact C1 restart outputs are invalid' }
          if ($exact.human_tested -ne $false) { throw 'Exact package evidence may not claim HUMAN_TESTED' }
          if ($exact.nvda_verified -ne $false) { throw 'Exact package evidence may not claim NVDA_VERIFIED' }
          if ($exact.production_release_ready -ne $false) { throw 'Exact package evidence may not claim release readiness' }
      - name: Upload exact C1 package evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PF11-C1-medium-app-${{ env.NIKA_CANDIDATE_SHA }}
          path: |
            dist/pf11-c1-medium-app-evidence.json
            dist/pf11-c1-exact-package-evidence.json
            build/pf11-c1/product/NikaC1ExpenseManager-windows-x64.zip
          if-no-files-found: error
