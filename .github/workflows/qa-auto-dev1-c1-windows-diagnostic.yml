name: AUTO-DEV1 C1 Windows Diagnostic

on:
  push:
    branches:
      - qa/auto-dev1/c1-windows-diagnostic-d977caa
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c1-windows-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      NIKA_CANDIDATE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact QA candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify exact checkout identity
        run: python scripts/qa_assert_checkout_identity.py

      - name: Install bounded Product Factory diagnostic dependencies
        run: python -m pip install -e ".[dev,agent,planning]"

      - name: Verify QA diagnostic source quality
        run: |
          ruff check tests/test_auto_dev1_c1_windows_diagnostic.py
          python -m compileall -q tests/test_auto_dev1_c1_windows_diagnostic.py

      - name: Run exact C1 diagnostic oracle
        run: python -m pytest -vv tests/test_auto_dev1_c1_windows_diagnostic.py
