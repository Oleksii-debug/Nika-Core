name: PF11 OpenHands Coding Backend

on:
  pull_request:
    paths:
      - "src/nika_core/toolsmith/openhands_remote_worker.py"
      - "src/nika_core/product_factory_openhands_recovery.py"
      - "src/nika_core/toolsmith/openhands_sdk_runtime.py"
      - "tests/test_toolsmith_openhands_remote_worker.py"
      - "tests/test_product_factory_openhands_recovery.py"
      - "tests/test_product_factory_coding_worker_adapter.py"
      - "pyproject.toml"
      - ".github/workflows/pf11-openhands-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NIKA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: pf11-openhands-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: OpenHands 1.49.2 compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.NIKA_CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify exact candidate checkout identity
        run: python scripts/qa_assert_checkout_identity.py
      - name: Install exact coding backend compatibility surface
        run: python -m pip install -e ".[dev,coding-openhands]"
      - name: Verify dependency graph and pinned OpenHands API surface
        shell: python
        run: |
          import importlib.metadata as metadata
          assert metadata.version("openhands-sdk") == "1.49.2"
          assert metadata.version("openhands-tools") == "1.49.2"
          from openhands.sdk import Conversation
          from openhands.tools.preset.default import get_default_agent
          assert Conversation is not None
          assert callable(get_default_agent)
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Lint PF11 backend slice
        run: >-
          python -m ruff check
          src/nika_core/toolsmith/openhands_remote_worker.py
          src/nika_core/toolsmith/openhands_sdk_runtime.py
          tests/test_toolsmith_openhands_remote_worker.py
      - name: Run CodingWorker and Product Factory adapter regressions
        run: >-
          python -m pytest
          tests/test_toolsmith_openhands_remote_worker.py
          tests/test_product_factory_coding_worker_adapter.py
          tests/test_product_factory_openhands_recovery.py
          -q
