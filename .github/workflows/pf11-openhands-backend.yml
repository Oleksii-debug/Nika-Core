name: PF11 OpenHands Coding Backend

on:
  pull_request:
    paths:
      - "src/nika_core/toolsmith/openhands_remote_worker.py"
      - "src/nika_core/toolsmith/openhands_sdk_runtime.py"
      - "src/nika_core/product_factory_coding_worker_adapter.py"
      - "src/nika_core/product_factory_coding_program.py"
      - "src/nika_core/product_factory_program_host.py"
      - "src/nika_core/product_factory_openhands_recovery.py"
      - "src/nika_core/product_factory_openhands_program.py"
      - "src/nika_core/product_factory_openhands_runtime_api.py"
      - "src/nika_core/product_factory_openhands_runtime_program.py"
      - "tests/test_toolsmith_openhands_remote_worker.py"
      - "tests/test_product_factory_coding_worker_adapter.py"
      - "tests/test_product_factory_coding_program.py"
      - "tests/test_product_factory_program_host.py"
      - "tests/test_product_factory_openhands_recovery.py"
      - "tests/test_product_factory_openhands_program.py"
      - "tests/test_product_factory_openhands_runtime_api.py"
      - "tests/test_product_factory_openhands_runtime_program.py"
      - "pyproject.toml"
      - ".github/workflows/pf11-openhands-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NIKA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: pf11-openhands-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nika-compatibility:
    name: Nika MCP2 + HTTP backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.NIKA_CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify exact candidate checkout identity
        run: python scripts/qa_assert_checkout_identity.py
      - name: Install combined Nika agent and coding backend surface
        run: python -m pip install -e ".[dev,agent,coding-openhands]"
      - name: Verify MCP2 remains authoritative and OpenHands stays out-of-process
        shell: python
        run: |
          import importlib.metadata as metadata
          from packaging.version import Version

          mcp_version = Version(metadata.version("mcp"))
          assert mcp_version.major == 2, mcp_version
          for distribution in ("openhands-sdk", "openhands-tools", "openhands-agent-server"):
              try:
                  metadata.version(distribution)
              except metadata.PackageNotFoundError:
                  pass
              else:
                  raise AssertionError(f"{distribution} leaked into the Nika process")
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Lint PF11 backend slice
        run: >-
          python -m ruff check
          src/nika_core/toolsmith/openhands_remote_worker.py
          src/nika_core/toolsmith/openhands_sdk_runtime.py
          src/nika_core/product_factory_coding_worker_adapter.py
          src/nika_core/product_factory_coding_program.py
          src/nika_core/product_factory_program_host.py
          src/nika_core/product_factory_openhands_recovery.py
          src/nika_core/product_factory_openhands_program.py
          src/nika_core/product_factory_openhands_runtime_api.py
          src/nika_core/product_factory_openhands_runtime_program.py
          tests/test_toolsmith_openhands_remote_worker.py
          tests/test_product_factory_coding_worker_adapter.py
          tests/test_product_factory_coding_program.py
          tests/test_product_factory_program_host.py
          tests/test_product_factory_openhands_recovery.py
          tests/test_product_factory_openhands_program.py
          tests/test_product_factory_openhands_runtime_api.py
          tests/test_product_factory_openhands_runtime_program.py
      - name: Run CodingWorker and Product Factory adapter regressions
        run: >-
          python -m pytest
          tests/test_toolsmith_openhands_remote_worker.py
          tests/test_product_factory_coding_worker_adapter.py
          tests/test_product_factory_coding_program.py
          tests/test_product_factory_program_host.py
          tests/test_product_factory_openhands_recovery.py
          tests/test_product_factory_openhands_program.py
          tests/test_product_factory_openhands_runtime_api.py
          tests/test_product_factory_openhands_runtime_program.py
          -q

  isolated-agent-server:
    name: Isolated OpenHands Agent Server 1.49.2 closure
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.NIKA_CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned isolated server closure
        run: >-
          python -m pip install
          openhands-agent-server==1.49.2
          openhands-sdk==1.49.2
          openhands-tools==1.49.2
      - name: Verify isolated server dependency consistency
        run: python -m pip check
      - name: Verify exact isolated server distributions
        shell: python
        run: |
          import importlib.metadata as metadata

          assert metadata.version("openhands-agent-server") == "1.49.2"
          assert metadata.version("openhands-sdk") == "1.49.2"
          assert metadata.version("openhands-tools") == "1.49.2"
