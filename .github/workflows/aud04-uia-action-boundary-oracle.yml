name: AUD04 UIA action-boundary oracle

on:
  push:
    branches:
      - "qa/aud04-uia-action-boundary-drift-5f972"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action-boundary-drift:
    name: Reject same-identity semantic drift before UIA action
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify exact QA checkout
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw "checkout SHA mismatch" }
      - name: Install narrow Windows interaction test dependencies
        run: python -m pip install -e ".[dev,windows-interaction]"
      - name: Compile target and QA oracle
        run: >-
          python -m py_compile
          src/nika_core/interaction/windows_uia_adapter.py
          tests/test_aud04_uia_action_boundary_drift.py
      - name: Run independent action-boundary drift oracle
        run: python -m pytest -q tests/test_aud04_uia_action_boundary_drift.py
