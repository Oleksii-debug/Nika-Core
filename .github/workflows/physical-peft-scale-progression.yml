name: Real Physical PEFT Scale Progression

on:
  pull_request:
    paths:
      - "src/nika_core/experiments/**"
      - "src/nika_core/learning_package/**"
      - "src/nika_core/model_engineering/**"
      - "src/nika_core/training_evaluation_*.py"
      - "src/nika_core/training_peft_worker.py"
      - "src/nika_core/training_physical_evaluation_driver.py"
      - "src/nika_core/training_physical_pilot.py"
      - "src/nika_core/training_physical_pilot_driver.py"
      - "src/nika_core/training_scale.py"
      - "scripts/physical_peft_real_proof.py"
      - "scripts/physical_peft_real_evaluator.py"
      - "scripts/physical_peft_evaluation_real_proof.py"
      - "scripts/physical_peft_scale_progression_real_proof.py"
      - "tests/test_physical_peft_scale_progression_real_proof.py"
      - "pyproject.toml"
      - ".github/workflows/physical-peft-scale-progression.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NIKA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: physical-peft-scale-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  progression:
    name: Windows CPU observed tier-0 to tier-1 PEFT progression
    runs-on: windows-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.NIKA_CANDIDATE_SHA }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify exact candidate checkout identity
        run: python scripts/qa_assert_checkout_identity.py

      - name: Install canonical PEFT training and evaluation stack
        run: python -m pip install -e ".[training]"

      - name: Run focused progression proof source tests
        run: >-
          python -m pytest -q
          tests/test_physical_peft_scale_progression_real_proof.py

      - name: Stage immutable model, held-out set and two-tier plan
        shell: pwsh
        run: |
          $proofName = "nika-physical-peft-scale-" + $env:GITHUB_RUN_ID
          $proofName += "-" + $env:GITHUB_RUN_ATTEMPT
          $proofRoot = Join-Path $env:RUNNER_TEMP $proofName
          if (Test-Path -LiteralPath $proofRoot) {
            throw "physical scale proof root already exists"
          }
          $trainer = (Get-Command nika-peft-trainer -ErrorAction Stop).Source
          python scripts/physical_peft_real_proof.py prepare --root $proofRoot --trainer-executable $trainer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/physical_peft_evaluation_real_proof.py prepare --root $proofRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/physical_peft_scale_progression_real_proof.py prepare-tier0 --root $proofRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "NIKA_PHYSICAL_SCALE_PROOF_ROOT=$proofRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HF_HUB_OFFLINE=1" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TRANSFORMERS_OFFLINE=1" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HF_DATASETS_OFFLINE=1" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TOKENIZERS_PARALLELISM=false" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Execute canonical tier-0 Windows PEFT pilot
        shell: pwsh
        run: |
          $pilot = (Get-Command nika-peft-physical-pilot -ErrorAction Stop).Source
          $config = Join-Path $env:NIKA_PHYSICAL_SCALE_PROOF_ROOT "physical-pilot.json"
          & $pilot $config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify exact tier-0 trained candidate
        shell: pwsh
        run: |
          python scripts/physical_peft_real_proof.py verify --root $env:NIKA_PHYSICAL_SCALE_PROOF_ROOT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Bind real evaluator and explicit non-regression promotion policy
        shell: pwsh
        run: |
          $evaluator = (Resolve-Path "scripts/physical_peft_real_evaluator.py").Path
          python scripts/physical_peft_evaluation_real_proof.py configure --root $env:NIKA_PHYSICAL_SCALE_PROOF_ROOT --evaluator-script $evaluator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/physical_peft_scale_progression_real_proof.py configure-promotion --root $env:NIKA_PHYSICAL_SCALE_PROOF_ROOT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Execute canonical promoted old-vs-new evaluation
        shell: pwsh
        run: |
          $evaluation = (Get-Command nika-peft-physical-evaluation -ErrorAction Stop).Source
          $config = Join-Path $env:NIKA_PHYSICAL_SCALE_PROOF_ROOT "physical-evaluation.json"
          & $evaluation $config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rehydrate trusted progression and prepare tier-1 authority
        shell: pwsh
        run: |
          python scripts/physical_peft_scale_progression_real_proof.py prepare-tier1 --root $env:NIKA_PHYSICAL_SCALE_PROOF_ROOT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Execute full-budget tier-1 Windows PEFT warm start
        shell: pwsh
        run: |
          $pilot = (Get-Command nika-peft-physical-pilot -ErrorAction Stop).Source
          $config = Join-Path $env:NIKA_PHYSICAL_SCALE_PROOF_ROOT "tier1-physical-pilot.json"
          $trustedRoot = Join-Path $env:NIKA_PHYSICAL_SCALE_PROOF_ROOT "run"
          & $pilot $config --trusted-progression-root $trustedRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify minimized cross-tier physical evidence
        shell: pwsh
        run: |
          python scripts/physical_peft_scale_progression_real_proof.py verify --root $env:NIKA_PHYSICAL_SCALE_PROOF_ROOT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload path-free physical scale progression evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: physical-peft-scale-real-${{ env.NIKA_CANDIDATE_SHA }}
          path: ${{ env.NIKA_PHYSICAL_SCALE_PROOF_ROOT }}/scale-evidence
          if-no-files-found: error
          retention-days: 14
