name: PF11 Durable-Bound Packaged Host

on:
  pull_request:
    paths:
      - "src/nika_core/product_project_schema.py"
      - "src/nika_core/product_factory_local_repository_binding.py"
      - "src/nika_core/product_factory_packaged_local_startup.py"
      - "src/nika_core/product_factory_packaged_bound_local_host.py"
      - "tests/test_product_factory_local_repository_binding.py"
      - "tests/test_product_factory_packaged_local_startup.py"
      - "tests/test_product_factory_packaged_bound_local_host.py"
      - ".github/workflows/pf11-local-repository-binding.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NIKA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: pf11-durable-bound-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  durable-bound-host:
    name: Durable-bound packaged host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.NIKA_CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify exact candidate checkout identity
        run: python scripts/qa_assert_checkout_identity.py
      - name: Install focused qualification dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Lint durable-bound packaged-host slice
        run: >-
          python -m ruff check
          src/nika_core/product_project_schema.py
          src/nika_core/product_factory_local_repository_binding.py
          src/nika_core/product_factory_packaged_local_startup.py
          src/nika_core/product_factory_packaged_bound_local_host.py
          tests/test_product_factory_local_repository_binding.py
          tests/test_product_factory_packaged_local_startup.py
          tests/test_product_factory_packaged_bound_local_host.py
      - name: Run durable-bound packaged-host regressions
        run: >-
          python -m pytest
          tests/test_product_factory_local_repository_binding.py
          tests/test_product_factory_packaged_local_startup.py
          tests/test_product_factory_packaged_bound_local_host.py
          -q
