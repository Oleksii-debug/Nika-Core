permissions:
  contents: read

env:
  NIKA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: m11-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.NIKA_CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify exact candidate checkout identity
        run: python scripts/qa_assert_checkout_identity.py
      - name: Install GUI, packaging and test dependencies
        run: python -m pip install -e ".[gui,voice,qa,dev]"
      - name: Install exact runtime and capture dependency provenance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./build/m11 | Out-Null
          $constraints = "./build/m11/pip-installed-constraints.txt"
          python -m pip list --format=freeze --exclude nika-core |
            Set-Content -Encoding utf8NoBOM $constraints
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --force-reinstall --quiet --constraint $constraints --report ./build/m11/pip-runtime-report.json ".[gui,voice]"
          $resolverExit = $LASTEXITCODE
          Remove-Item $constraints -Force -ErrorAction SilentlyContinue
          if ($resolverExit -ne 0) { exit $resolverExit }
      - name: Resolve canonical project version
        id: release
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if (-not $version) { throw 'Could not resolve [project].version from pyproject.toml' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Run M11 M12 source regressions
        run: >-
          python -m pytest
          tests/test_m11_m12_release.py
          tests/test_v01_stable_packaged_data_location.py
          tests/test_v01_legacy_database_adoption.py
          tests/test_backup_restore_wal_stale_preview.py
          tests/test_backup_restore_recovery_process_loss.py
          tests/test_backup_restore_recovery_lease.py
          tests/test_backup_restore_recovery_lease_adversarial.py
          tests/test_backup_restore_guardrails.py
          tests/test_backup_restore_recovery.py
          tests/test_backup_restore_metadata_safety.py
          tests/test_config_db_alias_conflict.py
          tests/test_v01_packaged_config_startup.py
          tests/test_packaged_speech_output.py
          tests/test_speech_output_windows.py
          tests/test_speech_streaming.py
          tests/test_packaged_voice_entrypoint.py
          tests/test_packaged_voice_model_setup.py
          tests/test_accessible_task_pagination.py
          tests/test_packaged_product_decision_presentation.py
          tests/test_packaged_product_status_presentation.py
          tests/test_product_factory_packaged_journey.py
          tests/test_packaged_product_factory_status.py
          tests/test_m5_product_project_semantic_status.py
          tests/test_m5_product_factory_operator_uia.py
          tests/test_terminal_packaged_command_convergence.py
          tests/test_terminal_packaged_task_explicit_target.py
          tests/test_terminal_user_flow_integration.py
          tests/test_packaged_startup_cleanup.py
          tests/test_desktop_voice.py
          tests/test_microphone_capture.py
          tests/test_microphone_capture_timeout_truth.py
          tests/test_sherpa_onnx_stt.py
          tests/test_speech_to_text.py
          tests/test_voice_turn.py
          tests/test_wake_activation.py
          tests/test_windows_microphone_capture.py
          tests/test_release_sbom.py
          tests/test_release_provenance_workflow.py
          tests/test_qa_workflow_lineage.py
          tests/test_model_gateway_cloud_authority.py
          tests/test_standing_permission_transaction.py
          tests/test_tool_risk_exact_authority.py
          tests/test_v01_cloud_model_permission.py
          tests/test_v01_desktop_task_admission.py
          tests/test_v01_model_settings.py
          tests/test_v01_model_settings_json_admission.py
          tests/test_v01_settings_json_unicode_admission.py
          tests/test_v01_source_settings.py
          tests/test_v01_source_settings_json_admission.py
          tests/test_v01_packaged_cloud_authority_composition.py
          tests/test_v01_packaged_runtime_cloud_authority.py
          tests/test_v01_packaged_startup_recovery.py
          tests/test_windows_cloud_model_permission.py
          tests/test_windows_cloud_settings_json_composition.py
          -q
      - name: Build standalone one-dir Windows candidate, notices and manifest
        shell: pwsh
        run: >-
          python scripts/m11_release.py
          --source-sha '${{ env.NIKA_CANDIDATE_SHA }}'
      - name: Generate and verify machine-readable supply-chain evidence
        run: >-
          python scripts/m11_sbom_evidence.py
          --bundle ./dist/NikaCore
          --report ./build/m11/pip-runtime-report.json
          --source-sha '${{ env.NIKA_CANDIDATE_SHA }}'
          --version '${{ steps.release.outputs.version }}'
      - name: Verify packaged WebView2 UI Automation and keyboard focus
        shell: pwsh
        run: ./scripts/v01_autostart_uia_proof.ps1 -ExePath ./dist/NikaCore/NikaCore.exe -WindowTitle 'Nika Core ${{ steps.release.outputs.version }}'
      - name: Create distributable ZIP
        shell: pwsh
        run: Compress-Archive -Path ./dist/NikaCore/* -DestinationPath ./dist/NikaCore-${{ steps.release.outputs.version }}-windows-x64.zip -Force
      - name: Upload M11 release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NikaCore-${{ steps.release.outputs.version }}-windows-x64-${{ env.NIKA_CANDIDATE_SHA }}
          path: |
            dist/NikaCore-${{ steps.release.outputs.version }}-windows-x64.zip
            dist/NikaCore/release-manifest.json
            dist/NikaCore/THIRD_PARTY_NOTICES.txt
            dist/NikaCore/THIRD_PARTY_SUPPLY_CHAIN.json
            dist/NikaCore/THIRD_PARTY_SBOM.cdx.json
          if-no-files-found: error