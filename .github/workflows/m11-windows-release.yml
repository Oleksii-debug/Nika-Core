name: M11 Windows Release Candidate

on:
  pull_request:
    paths:
      - "src/nika_core/packaging/**"
      - "src/nika_core/qa/**"
      - "src/nika_core/ui/**"
      - "src/nika_core/model_gateway/**"
      - "src/nika_core/security/model_cloud_authority.py"
      - "src/nika_core/security/standing_permission.py"
      - "src/nika_core/v01_cloud_model_permission.py"
      - "src/nika_core/v01_model_settings.py"
      - "src/nika_core/v01_settings_json.py"
      - "src/nika_core/v01_source_settings.py"
      - "src/nika_core/v01_packaged_team_runtime.py"
      - "scripts/nika_windows.py"
      - "tests/test_model_gateway_cloud_authority.py"
      - "tests/test_standing_permission_transaction.py"
      - "tests/test_tool_risk_exact_authority.py"
      - "tests/test_v01_cloud_model_permission.py"
      - "tests/test_v01_desktop_task_admission.py"
      - "tests/test_v01_model_settings.py"
      - "tests/test_v01_model_settings_json_admission.py"
      - "tests/test_v01_settings_json_unicode_admission.py"
      - "tests/test_v01_source_settings.py"
      - "tests/test_v01_source_settings_json_admission.py"
      - "tests/test_v01_packaged_cloud_authority_composition.py"
      - "tests/test_v01_packaged_runtime_cloud_authority.py"
      - "tests/test_v01_packaged_startup_recovery.py"
      - "tests/test_windows_cloud_model_permission.py"
      - "tests/test_windows_cloud_settings_json_composition.py"
      - "scripts/m11_release.py"
      - "scripts/m5_uia_proof.ps1"
      - "scripts/v01_autostart_uia_proof.ps1"
      - "scripts/qa_assert_checkout_identity.py"
      - "tests/test_m11_m12_release.py"
      - "tests/test_qa_workflow_lineage.py"
      - "pyproject.toml"
      - ".github/workflows/m11-windows-release.yml"
  push:
    branches:
      - "main"
    paths:
      - "src/nika_core/packaging/**"
      - "src/nika_core/qa/**"
      - "src/nika_core/ui/**"
      - "src/nika_core/model_gateway/**"
      - "src/nika_core/security/model_cloud_authority.py"
      - "src/nika_core/security/standing_permission.py"
      - "src/nika_core/v01_cloud_model_permission.py"
      - "src/nika_core/v01_model_settings.py"
      - "src/nika_core/v01_settings_json.py"
      - "src/nika_core/v01_source_settings.py"
      - "src/nika_core/v01_packaged_team_runtime.py"
      - "scripts/nika_windows.py"
      - "tests/test_model_gateway_cloud_authority.py"
      - "tests/test_standing_permission_transaction.py"
      - "tests/test_tool_risk_exact_authority.py"
      - "tests/test_v01_cloud_model_permission.py"
      - "tests/test_v01_desktop_task_admission.py"
      - "tests/test_v01_model_settings.py"
      - "tests/test_v01_model_settings_json_admission.py"
      - "tests/test_v01_settings_json_unicode_admission.py"
      - "tests/test_v01_source_settings.py"
      - "tests/test_v01_source_settings_json_admission.py"
      - "tests/test_v01_packaged_cloud_authority_composition.py"
      - "tests/test_v01_packaged_runtime_cloud_authority.py"
      - "tests/test_v01_packaged_startup_recovery.py"
      - "tests/test_windows_cloud_model_permission.py"
      - "tests/test_windows_cloud_settings_json_composition.py"
      - "scripts/m11_release.py"
      - "scripts/m5_uia_proof.ps1"
      - "scripts/v01_autostart_uia_proof.ps1"
      - "scripts/qa_assert_checkout_identity.py"
      - "tests/test_m11_m12_release.py"
      - "tests/test_qa_workflow_lineage.py"
      - "pyproject.toml"
      - ".github/workflows/m11-windows-release.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NIKA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: m11-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.NIKA_CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify exact candidate checkout identity
        run: python scripts/qa_assert_checkout_identity.py
      - name: Install GUI, packaging and test dependencies
        run: python -m pip install -e ".[gui,qa,dev]"
      - name: Resolve canonical project version
        id: release
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if (-not $version) { throw 'Could not resolve [project].version from pyproject.toml' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Run M11 M12 source regressions
        run: >-
          python -m pytest
          tests/test_m11_m12_release.py
          tests/test_qa_workflow_lineage.py
          tests/test_model_gateway_cloud_authority.py
          tests/test_standing_permission_transaction.py
          tests/test_tool_risk_exact_authority.py
          tests/test_v01_cloud_model_permission.py
          tests/test_v01_desktop_task_admission.py
          tests/test_v01_model_settings.py
          tests/test_v01_model_settings_json_admission.py
          tests/test_v01_settings_json_unicode_admission.py
          tests/test_v01_source_settings.py
          tests/test_v01_source_settings_json_admission.py
          tests/test_v01_packaged_cloud_authority_composition.py
          tests/test_v01_packaged_runtime_cloud_authority.py
          tests/test_v01_packaged_startup_recovery.py
          tests/test_windows_cloud_model_permission.py
          tests/test_windows_cloud_settings_json_composition.py
          -q
      - name: Build standalone one-dir Windows candidate, notices and manifest
        shell: pwsh
        run: >-
          python scripts/m11_release.py
          --source-sha '${{ env.NIKA_CANDIDATE_SHA }}'
      - name: Verify packaged WebView2 UI Automation and keyboard focus
        shell: pwsh
        run: ./scripts/v01_autostart_uia_proof.ps1 -ExePath ./dist/NikaCore/NikaCore.exe -WindowTitle 'Nika Core ${{ steps.release.outputs.version }}'
      - name: Create distributable ZIP
        shell: pwsh
        run: Compress-Archive -Path ./dist/NikaCore/* -DestinationPath ./dist/NikaCore-${{ steps.release.outputs.version }}-windows-x64.zip -Force
      - name: Upload M11 release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NikaCore-${{ steps.release.outputs.version }}-windows-x64-${{ env.NIKA_CANDIDATE_SHA }}
          path: |
            dist/NikaCore-${{ steps.release.outputs.version }}-windows-x64.zip
            dist/NikaCore/release-manifest.json
            dist/NikaCore/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
