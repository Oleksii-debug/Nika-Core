name: DEV05 Media Foundation Proof

on:
  pull_request:
    paths:
      - "src/nika_core/media/**"
      - "tests/test_media_*.py"
      - "pyproject.toml"
      - ".github/workflows/dev05-media-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NIKA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: dev05-media-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  media-foundation:
    name: Media foundation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.NIKA_CANDIDATE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify exact candidate checkout identity
        run: python scripts/qa_assert_checkout_identity.py
      - name: Install DEV05 optional media foundation
        run: python -m pip install -e ".[dev,media]"
      - name: Verify pinned media package identities
        run: >-
          python -c "import importlib.metadata as m;
          assert m.version('yt-dlp') == '2026.6.9';
          assert m.version('pysubs2') == '1.8.1';
          print('yt-dlp', m.version('yt-dlp'), 'pysubs2', m.version('pysubs2'))"
      - name: Compile and lint media foundation
        run: >-
          python -m compileall -q src/nika_core/media tests/test_media_*.py &&
          python -m ruff check src/nika_core/media tests/test_media_*.py
      - name: Run focused DEV05 Batch A tests
        run: python -m pytest -q tests/test_media_*.py
