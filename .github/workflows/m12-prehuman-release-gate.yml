name: M12 Pre-Human Release Gate

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/m11-windows-release.yml"
      - ".github/workflows/m12-prehuman-release-gate.yml"
      - "docs/M12_HUMAN_NVDA_ACCEPTANCE.md"
  push:
    branches:
      - "main"
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/m11-windows-release.yml"
      - ".github/workflows/m12-prehuman-release-gate.yml"
      - "docs/M12_HUMAN_NVDA_ACCEPTANCE.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  NIKA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: m12-prehuman-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrated-ubuntu:
    name: M12 integrated system proof (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.NIKA_CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify exact candidate checkout identity
        run: python scripts/qa_assert_checkout_identity.py
      - name: Install core, runtime, planning and browser proof dependencies
        run: python -m pip install -e ".[dev,agent,planning,browser]"
      - name: Run complete source, dependency and test verification
        run: python scripts/verify.py
      - name: Re-run focused cross-subsystem recovery and safety matrix
        run: >-
          python -m pytest -q
          tests/test_runtime_crash_consistency.py
          tests/test_runtime_startup_recovery.py
          tests/test_runtime_cancel_safety.py
          tests/test_m3_memory_scheduler_resources.py
          tests/test_m4_model_tools.py
          tests/test_deterministic_brain.py
          tests/test_foundry_local_provider.py
          tests/test_plugin_workspace_sdk.py
          tests/test_agent_lab_activation_boundary.py
          tests/test_security_policy.py
          tests/test_m11_m12_release.py
          tests/test_qa_workflow_lineage.py
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Re-prove browser semantic interaction on the exact candidate
        run: python scripts/m9_browser_adapter_proof.py

  integrated-windows:
    name: M12 integrated system proof (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.NIKA_CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify exact candidate checkout identity
        run: python scripts/qa_assert_checkout_identity.py
      - name: Install core, runtime, planning and Windows interaction proof dependencies
        run: python -m pip install -e ".[dev,agent,planning,windows-interaction]"
      - name: Run complete source, dependency and test verification
        run: python scripts/verify.py
      - name: Re-run focused cross-subsystem recovery and safety matrix
        run: >-
          python -m pytest -q
          tests/test_runtime_crash_consistency.py
          tests/test_runtime_startup_recovery.py
          tests/test_runtime_cancel_safety.py
          tests/test_m3_memory_scheduler_resources.py
          tests/test_m4_model_tools.py
          tests/test_deterministic_brain.py
          tests/test_foundry_local_provider.py
          tests/test_plugin_workspace_sdk.py
          tests/test_agent_lab_activation_boundary.py
          tests/test_security_policy.py
          tests/test_m11_m12_release.py
          tests/test_qa_workflow_lineage.py
      - name: Re-prove Windows semantic interaction on the exact candidate
        run: python scripts/m9_windows_uia_proof.py

  packaged-windows:
    name: M12 packaged release proof (Windows)
    needs: [integrated-ubuntu, integrated-windows]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.NIKA_CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify exact candidate checkout identity
        run: python scripts/qa_assert_checkout_identity.py
      - name: Install GUI, packaging and QA dependencies
        run: python -m pip install -e ".[gui,qa,dev]"
      - name: Install exact runtime and capture dependency provenance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./build/m12 | Out-Null
          $constraints = "./build/m12/pip-installed-constraints.txt"
          python -m pip list --format=freeze --exclude nika-core |
            Set-Content -Encoding utf8NoBOM $constraints
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --ignore-installed --quiet --constraint $constraints --report ./build/m12/pip-runtime-report.json ".[gui]"
          $resolverExit = $LASTEXITCODE
          Remove-Item $constraints -Force -ErrorAction SilentlyContinue
          if ($resolverExit -ne 0) { exit $resolverExit }
      - name: Resolve canonical project version
        id: release
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if (-not $version) { throw 'Could not resolve [project].version from pyproject.toml' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build exact Windows release candidate, notices and manifest
        run: >-
          python scripts/m11_release.py
          --source-sha '${{ env.NIKA_CANDIDATE_SHA }}'
      - name: Generate and verify machine-readable supply-chain evidence
        run: >-
          python scripts/m11_sbom_evidence.py
          --bundle ./dist/NikaCore
          --report ./build/m12/pip-runtime-report.json
          --source-sha '${{ env.NIKA_CANDIDATE_SHA }}'
          --version '${{ steps.release.outputs.version }}'
      - name: Verify packaged WebView2 UI Automation and keyboard focus
        shell: pwsh
        run: ./scripts/v01_autostart_uia_proof.ps1 -ExePath ./dist/NikaCore/NikaCore.exe -WindowTitle 'Nika Core ${{ steps.release.outputs.version }}'
      - name: Run release-gate truth regressions
        run: python -m pytest tests/test_m11_m12_release.py tests/test_qa_workflow_lineage.py -q
      - name: Create distributable ZIP
        shell: pwsh
        run: Compress-Archive -Path ./dist/NikaCore/* -DestinationPath ./dist/NikaCore-${{ steps.release.outputs.version }}-windows-x64.zip -Force
      - name: Hash exact distributable ZIP
        id: distributable
        shell: pwsh
        run: |
          $zipPath = './dist/NikaCore-${{ steps.release.outputs.version }}-windows-x64.zip'
          if (-not (Test-Path -LiteralPath $zipPath -PathType Leaf)) {
            throw "Final distributable ZIP does not exist: $zipPath"
          }
          $zipItem = Get-Item -LiteralPath $zipPath
          $zipSha256 = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($zipSha256 -notmatch '^[0-9a-f]{64}$') {
            throw "Invalid final distributable SHA-256: $zipSha256"
          }
          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT
          "zip_sha256=$zipSha256" >> $env:GITHUB_OUTPUT
          "zip_size=$($zipItem.Length)" >> $env:GITHUB_OUTPUT
      - name: Re-prove runtime from exact extracted final ZIP
        id: exact-final-runtime
        shell: pwsh
        run: |
          $zipPath = '${{ steps.distributable.outputs.zip_path }}'
          $extractRoot = Join-Path $env:RUNNER_TEMP 'Nika Core — фінальний ZIP'
          if (Test-Path -LiteralPath $extractRoot) {
            Remove-Item -LiteralPath $extractRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
          python -c "from pathlib import Path; from nika_core.packaging.release import verify_release_archive; findings = verify_release_archive(Path(r'$zipPath'), source_sha='${{ env.NIKA_CANDIDATE_SHA }}', expected_product_version='${{ steps.release.outputs.version }}'); print('\n'.join(findings)); raise SystemExit(1 if findings else 0)"
          if ($LASTEXITCODE -ne 0) {
            throw 'Exact final distributable ZIP failed canonical archive verification before extraction.'
          }
          Expand-Archive -LiteralPath $zipPath -DestinationPath $extractRoot -Force
          $env:NIKA_EXTRACTED_RELEASE_ROOT = $extractRoot
          python -c "import os; from pathlib import Path; from nika_core.packaging.release import _decode_release_manifest, verify_release_manifest; root = Path(os.environ['NIKA_EXTRACTED_RELEASE_ROOT']); manifest = _decode_release_manifest((root / 'release-manifest.json').read_bytes()); assert manifest is not None, 'invalid extracted release manifest'; assert manifest.source_sha == '${{ env.NIKA_CANDIDATE_SHA }}', 'extracted release manifest source SHA mismatch'; assert manifest.version == '${{ steps.release.outputs.version }}', 'extracted release manifest product version mismatch'; findings = verify_release_manifest(root, manifest); print('\n'.join(findings)); raise SystemExit(1 if findings else 0)"
          if ($LASTEXITCODE -ne 0) {
            throw 'Extracted exact final distributable failed release-manifest verification.'
          }
          foreach ($requiredEvidence in @('THIRD_PARTY_SUPPLY_CHAIN.json', 'THIRD_PARTY_SBOM.cdx.json')) {
            $requiredPath = Join-Path $extractRoot $requiredEvidence
            if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) {
              throw "Exact final distributable is missing required supply-chain evidence: $requiredEvidence"
            }
          }
          $extractedExe = Join-Path $extractRoot 'NikaCore.exe'
          if (-not (Test-Path -LiteralPath $extractedExe -PathType Leaf)) {
            throw "Extracted final distributable executable is missing: $extractedExe"
          }
          ./scripts/v01_autostart_uia_proof.ps1 -ExePath $extractedExe -WindowTitle 'Nika Core ${{ steps.release.outputs.version }}'
          $exact_final_artifact_runtime_uia = $true
          "exact_final_artifact_runtime_uia=$($exact_final_artifact_runtime_uia.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Record automated pre-human evidence
        shell: pwsh
        run: |
          if ('${{ steps.exact-final-runtime.outputs.exact_final_artifact_runtime_uia }}' -ne 'true') {
            throw 'Exact final artifact runtime/UIA proof did not complete.'
          }
          $evidence = [ordered]@{
            schema_version = 4
            product_version = '${{ steps.release.outputs.version }}'
            commit_sha = '${{ env.NIKA_CANDIDATE_SHA }}'
            distributable_zip_path = '${{ steps.distributable.outputs.zip_path }}'
            distributable_zip_sha256 = '${{ steps.distributable.outputs.zip_sha256 }}'
            distributable_zip_size = [int64]'${{ steps.distributable.outputs.zip_size }}'
            release_manifest_source_sha_bound = $true
            exact_checkout_sha_verified = $true
            core_ci_equivalent = $true
            full_test_suite = $true
            runtime_restart_recovery = $true
            memory_scheduler_resource_regressions = $true
            model_mock_nollm_regressions = $true
            deterministic_brain_regressions = $true
            foundry_local_adapter_regressions = $true
            plugin_workspace_regressions = $true
            security_sandbox_regressions = $true
            integrated_ubuntu = $true
            integrated_windows = $true
            browser_semantic_proof = $true
            windows_uia_semantic_proof = $true
            windows_package_built = $true
            manifest_verified = $true
            third_party_notices_verified = $true
            machine_readable_sbom_verified = $true
            supply_chain_provenance_verified = $true
            packaged_uia_keyboard_focus = $true
            physical_windows_foundry_inference_proven = $false
            human_tested = $false
            nvda_verified = $false
            production_release_ready = $false
          }
          $evidence | ConvertTo-Json | Set-Content -Encoding UTF8 ./dist/m12-prehuman-evidence.json
      - name: Verify exact final distributable evidence binding
        run: >-
          python scripts/m12_release_evidence.py
          --artifact '${{ steps.distributable.outputs.zip_path }}'
          --artifact-reference '${{ steps.distributable.outputs.zip_path }}'
          --evidence ./dist/m12-prehuman-evidence.json
          --source-sha '${{ env.NIKA_CANDIDATE_SHA }}'
          --product-version '${{ steps.release.outputs.version }}'
      - name: Upload exact pre-human candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NikaCore-${{ steps.release.outputs.version }}-m12-prehuman-${{ env.NIKA_CANDIDATE_SHA }}
          path: |
            dist/NikaCore-${{ steps.release.outputs.version }}-windows-x64.zip
            dist/NikaCore/release-manifest.json
            dist/NikaCore/THIRD_PARTY_NOTICES.txt
            dist/NikaCore/THIRD_PARTY_SUPPLY_CHAIN.json
            dist/NikaCore/THIRD_PARTY_SBOM.cdx.json
            dist/m12-prehuman-evidence.json
          if-no-files-found: error

  attest-main-distributable:
    name: M12 cryptographic distributable provenance (main)
    needs: [packaged-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact integrated source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify exact integrated checkout identity
        env:
          NIKA_CANDIDATE_SHA: ${{ github.sha }}
        run: python ./scripts/qa_assert_checkout_identity.py
      - name: Install minimal release-verification package
        run: python -m pip install --no-deps -e .
      - name: Resolve canonical project version
        id: release
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if (-not $version) { throw 'Could not resolve [project].version from pyproject.toml' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Download exact packaged evidence from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: NikaCore-${{ steps.release.outputs.version }}-m12-prehuman-${{ github.sha }}
          path: ./attestation-input
      - name: Re-verify downloaded final distributable before signing
        shell: pwsh
        run: |
          $zipPath = './attestation-input/NikaCore-${{ steps.release.outputs.version }}-windows-x64.zip'
          python scripts/m12_release_evidence.py `
            --artifact $zipPath `
            --artifact-reference './dist/NikaCore-${{ steps.release.outputs.version }}-windows-x64.zip' `
            --evidence ./attestation-input/m12-prehuman-evidence.json `
            --source-sha '${{ github.sha }}' `
            --product-version '${{ steps.release.outputs.version }}'
      - name: Attest exact final distributable
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ./attestation-input/NikaCore-${{ steps.release.outputs.version }}-windows-x64.zip
      - name: Cryptographically verify repository, signer and source provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zipPath = './attestation-input/NikaCore-${{ steps.release.outputs.version }}-windows-x64.zip'
          New-Item -ItemType Directory -Force ./attestation-output | Out-Null
          gh attestation verify $zipPath `
            --repo '${{ github.repository }}' `
            --signer-workflow '${{ github.repository }}/.github/workflows/m12-prehuman-release-gate.yml' `
            --source-digest '${{ github.sha }}' `
            --source-ref '${{ github.ref }}' `
            --deny-self-hosted-runners `
            --format json |
            Set-Content -Encoding UTF8 ./attestation-output/verification.json
      - name: Record verified cryptographic provenance evidence
        run: >-
          python scripts/m12_attestation_evidence.py
          --artifact './attestation-input/NikaCore-${{ steps.release.outputs.version }}-windows-x64.zip'
          --artifact-reference './dist/NikaCore-${{ steps.release.outputs.version }}-windows-x64.zip'
          --prehuman-evidence ./attestation-input/m12-prehuman-evidence.json
          --verification ./attestation-output/verification.json
          --source-sha '${{ github.sha }}'
          --repository '${{ github.repository }}'
          --signer-workflow '${{ github.repository }}/.github/workflows/m12-prehuman-release-gate.yml'
          --source-ref '${{ github.ref }}'
          --attestation-id '${{ steps.attest.outputs.attestation-id }}'
          --attestation-url '${{ steps.attest.outputs.attestation-url }}'
          --output ./attestation-output/m12-attestation-evidence.json
      - name: Preserve attestation bundle and verified sidecar
        shell: pwsh
        run: |
          Copy-Item -LiteralPath '${{ steps.attest.outputs.bundle-path }}' -Destination ./attestation-output/attestation-bundle.json
      - name: Upload cryptographic provenance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NikaCore-${{ steps.release.outputs.version }}-m12-attestation-${{ github.sha }}
          path: |
            attestation-output/attestation-bundle.json
            attestation-output/verification.json
            attestation-output/m12-attestation-evidence.json
          if-no-files-found: error
