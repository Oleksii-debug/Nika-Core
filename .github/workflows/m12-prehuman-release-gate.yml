name: M12 Pre-Human Release Gate

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
env:
  NIKA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  integrated-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.NIKA_CANDIDATE_SHA }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[dev,agent,planning,browser]"
      - run: python scripts/verify.py
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/m9_browser_adapter_proof.py
  integrated-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.NIKA_CANDIDATE_SHA }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[dev,agent,planning,windows-interaction]"
      - run: python scripts/verify.py
      - run: python scripts/m9_windows_uia_proof.py
  packaged-windows:
    needs: [integrated-ubuntu, integrated-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.NIKA_CANDIDATE_SHA }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[gui,qa,dev]"
      - id: release
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: python scripts/m11_release.py --source-sha '${{ env.NIKA_CANDIDATE_SHA }}'
      - shell: pwsh
        run: ./scripts/m5_uia_proof.ps1 -ExePath ./dist/NikaCore/NikaCore.exe -WindowTitle 'Nika Core ${{ steps.release.outputs.version }}'
      - shell: pwsh
        run: Compress-Archive -Path ./dist/NikaCore/* -DestinationPath ./dist/NikaCore-${{ steps.release.outputs.version }}-windows-x64.zip -Force
      - id: distributable
        shell: pwsh
        run: |
          $p='./dist/NikaCore-${{ steps.release.outputs.version }}-windows-x64.zip'; "zip_path=$p" >> $env:GITHUB_OUTPUT; "zip_sha256=$((Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT; "zip_size=$((Get-Item $p).Length)" >> $env:GITHUB_OUTPUT
      - shell: pwsh
        run: |
          [ordered]@{schema_version=3; commit_sha='${{ env.NIKA_CANDIDATE_SHA }}'; distributable_zip_path='${{ steps.distributable.outputs.zip_path }}'; distributable_zip_sha256='${{ steps.distributable.outputs.zip_sha256 }}'; distributable_zip_size=[int64]'${{ steps.distributable.outputs.zip_size }}'; human_tested=$false; nvda_verified=$false; production_release_ready=$false} | ConvertTo-Json | Set-Content -Encoding UTF8 ./dist/m12-prehuman-evidence.json
      - run: python scripts/m12_release_evidence.py --artifact '${{ steps.distributable.outputs.zip_path }}' --artifact-reference '${{ steps.distributable.outputs.zip_path }}' --evidence ./dist/m12-prehuman-evidence.json --source-sha '${{ env.NIKA_CANDIDATE_SHA }}'
      - uses: actions/upload-artifact@v4
        with:
          name: NikaCore-${{ steps.release.outputs.version }}-m12-prehuman-${{ env.NIKA_CANDIDATE_SHA }}
          path: |
            dist/NikaCore-${{ steps.release.outputs.version }}-windows-x64.zip
            dist/m12-prehuman-evidence.json
  attest-main-distributable:
    needs: [packaged-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions: {contents: read, id-token: write, attestations: write, artifact-metadata: write}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: python -m pip install --no-deps -e .
      - id: release
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"; "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: "NikaCore-${{ steps.release.outputs.version }}-m12-prehuman-${{ github.sha }}", path: ./attestation-input}
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with: {subject-path: "./attestation-input/NikaCore-${{ steps.release.outputs.version }}-windows-x64.zip"}
      - shell: pwsh
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          New-Item -ItemType Directory -Force ./attestation-output | Out-Null
          gh attestation verify './attestation-input/NikaCore-${{ steps.release.outputs.version }}-windows-x64.zip' --repo '${{ github.repository }}' --signer-workflow '${{ github.repository }}/.github/workflows/m12-prehuman-release-gate.yml' --source-digest '${{ github.sha }}' --source-ref '${{ github.ref }}' --deny-self-hosted-runners --format json | Set-Content -Encoding UTF8 ./attestation-output/verification.json
      - run: python scripts/m12_attestation_evidence.py --artifact './attestation-input/NikaCore-${{ steps.release.outputs.version }}-windows-x64.zip' --artifact-reference './dist/NikaCore-${{ steps.release.outputs.version }}-windows-x64.zip' --prehuman-evidence ./attestation-input/m12-prehuman-evidence.json --verification ./attestation-output/verification.json --source-sha '${{ github.sha }}' --repository '${{ github.repository }}' --signer-workflow '${{ github.repository }}/.github/workflows/m12-prehuman-release-gate.yml' --source-ref '${{ github.ref }}' --attestation-id '${{ steps.attest.outputs.attestation-id }}' --attestation-url '${{ steps.attest.outputs.attestation-url }}' --output ./attestation-output/m12-attestation-evidence.json
      - shell: pwsh
        run: Copy-Item '${{ steps.attest.outputs.bundle-path }}' ./attestation-output/attestation-bundle.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NikaCore-${{ steps.release.outputs.version }}-m12-attestation-${{ github.sha }}
          path: attestation-output
