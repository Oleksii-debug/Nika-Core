name: Real Physical PEFT Old-vs-New Evaluation

on:
  pull_request:
    paths:
      - "src/nika_core/experiments/**"
      - "src/nika_core/learning_package/**"
      - "src/nika_core/model_engineering/**"
      - "src/nika_core/training_evaluation_*.py"
      - "src/nika_core/training_peft_worker.py"
      - "src/nika_core/training_physical_evaluation_driver.py"
      - "src/nika_core/training_physical_pilot.py"
      - "src/nika_core/training_physical_pilot_driver.py"
      - "scripts/physical_peft_real_proof.py"
      - "scripts/physical_peft_real_evaluator.py"
      - "scripts/physical_peft_evaluation_real_proof.py"
      - "tests/test_physical_peft_real_evaluation_proof.py"
      - "pyproject.toml"
      - ".github/workflows/physical-peft-real-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NIKA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: physical-peft-evaluation-real-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  old-vs-new:
    name: Windows CPU observed old-vs-new PEFT evaluation
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.NIKA_CANDIDATE_SHA }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify exact candidate checkout identity
        run: python scripts/qa_assert_checkout_identity.py

      - name: Install canonical PEFT training and evaluation stack
        run: python -m pip install -e ".[training]"

      - name: Run focused qualification source tests
        run: >-
          python -m pytest -q
          tests/test_physical_peft_real_evaluation_proof.py

      - name: Stage immutable public model and held-out authority
        shell: pwsh
        run: |
          $proofName = "nika-physical-peft-eval-" + $env:GITHUB_RUN_ID
          $proofName += "-" + $env:GITHUB_RUN_ATTEMPT
          $proofRoot = Join-Path $env:RUNNER_TEMP $proofName
          if (Test-Path -LiteralPath $proofRoot) {
            throw "physical evaluation proof root already exists"
          }
          $trainer = (Get-Command nika-peft-trainer -ErrorAction Stop).Source
          $prepareArgs = @(
            "scripts/physical_peft_real_proof.py",
            "prepare",
            "--root",
            $proofRoot,
            "--trainer-executable",
            $trainer
          )
          python @prepareArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          python scripts/physical_peft_evaluation_real_proof.py prepare --root $proofRoot
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          "NIKA_PHYSICAL_EVAL_PROOF_ROOT=$proofRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HF_HUB_OFFLINE=1" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TRANSFORMERS_OFFLINE=1" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HF_DATASETS_OFFLINE=1" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TOKENIZERS_PARALLELISM=false" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Execute canonical Windows physical PEFT pilot
        shell: pwsh
        run: |
          $pilot = (Get-Command nika-peft-physical-pilot -ErrorAction Stop).Source
          $config = Join-Path $env:NIKA_PHYSICAL_EVAL_PROOF_ROOT "physical-pilot.json"
          & $pilot $config
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify exact trained candidate before evaluation
        shell: pwsh
        run: |
          python scripts/physical_peft_real_proof.py verify `
            --root $env:NIKA_PHYSICAL_EVAL_PROOF_ROOT
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Bind evaluator command and exact model authorities
        shell: pwsh
        run: |
          $evaluator = (Resolve-Path "scripts/physical_peft_real_evaluator.py").Path
          python scripts/physical_peft_evaluation_real_proof.py configure `
            --root $env:NIKA_PHYSICAL_EVAL_PROOF_ROOT `
            --evaluator-script $evaluator
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Execute canonical observed old-vs-new evaluation
        shell: pwsh
        run: |
          $evaluation = (
            Get-Command nika-peft-physical-evaluation -ErrorAction Stop
          ).Source
          $config = Join-Path $env:NIKA_PHYSICAL_EVAL_PROOF_ROOT "physical-evaluation.json"
          & $evaluation $config
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify minimized old-vs-new evidence
        shell: pwsh
        run: |
          python scripts/physical_peft_evaluation_real_proof.py verify `
            --root $env:NIKA_PHYSICAL_EVAL_PROOF_ROOT
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload path-free old-vs-new proof evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: physical-peft-old-new-real-${{ env.NIKA_CANDIDATE_SHA }}
          path: ${{ env.NIKA_PHYSICAL_EVAL_PROOF_ROOT }}/evaluation-evidence
          if-no-files-found: error
          retention-days: 14
