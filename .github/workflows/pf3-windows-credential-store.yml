name: PF3 Windows Credential Store Proof

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NIKA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: pf3-credential-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-credential-store:
    name: Windows Credential Manager (${{ matrix.binding }})
    if: >-
      github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'auto-pf3/windows-credential')
    strategy:
      fail-fast: false
      matrix:
        binding: [ctypes, cffi]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.NIKA_CANDIDATE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify exact candidate checkout identity
        run: python scripts/qa_assert_checkout_identity.py
      - name: Install PF3 credential, QA and test dependencies
        run: python -m pip install -e ".[dev,credentials,qa]"
      - name: Force ctypes binding path
        if: matrix.binding == 'ctypes'
        run: python -m pip uninstall -y cffi
      - name: Force cffi binding path
        if: matrix.binding == 'cffi'
        run: python -m pip install "cffi==2.1.1"
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run PF3 broker and Windows credential regressions
        run: >-
          python -m pytest
          tests/test_product_factory_credentials.py
          tests/test_product_factory_windows_credentials.py
          tests/test_product_factory_windows_credentials_integration.py
      - name: Prove real current-user Windows Credential Manager lifecycle
        run: python scripts/pf3_windows_credential_proof.py
      - name: Build packaged credential proof
        shell: pwsh
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --console
          --name PF3CredentialProof
          scripts/pf3_windows_credential_proof.py
      - name: Prove packaged credential adapter and cleanup
        shell: pwsh
        run: ./dist/PF3CredentialProof/PF3CredentialProof.exe
