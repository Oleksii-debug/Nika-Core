name: Core CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NIKA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.NIKA_CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify exact candidate checkout identity
        run: python scripts/qa_assert_checkout_identity.py
      - name: Install core, agent and deterministic planning test dependencies
        run: python -m pip install -e ".[dev,agent,planning]"
      - name: Verify source, dependencies and tests
        run: python scripts/verify.py

  required-core-gate:
    name: Core required gate
    if: ${{ always() }}
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Ubuntu and Windows Core verification
        shell: bash
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          set -euo pipefail
          printf 'Core verify aggregate result: %s\n' "$VERIFY_RESULT"
          test "$VERIFY_RESULT" = "success"

  embedded-foundry-sdk-proof:
    name: Embedded Foundry Local SDK dependency proof
    if: >-
      github.event_name == 'pull_request' &&
      (github.head_ref == 'feat/embedded-intelligence-foundry-local' ||
       startsWith(github.head_ref, 'fix/auto02-') ||
       startsWith(github.head_ref, 'feat/auto02-'))
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.NIKA_CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify exact candidate checkout identity
        run: python scripts/qa_assert_checkout_identity.py
      - name: Install Windows embedded intelligence component
        run: python -m pip install -e ".[embedded-ai]"
      - name: Verify Microsoft Foundry Local Python SDK surface is importable
        run: >-
          python -c "from foundry_local_sdk import Configuration, FoundryLocalManager;
          c=Configuration(app_name='NikaCoreCI');
          print(type(c).__name__, FoundryLocalManager.__name__)"
      - name: Verify physical-proof collector is import-safe without running a model
        run: python scripts/prove_foundry_local.py --help

  m4-live-ollama-proof:
    name: M4 live Ollama provider proof
    if: >-
      github.event_name == 'pull_request' &&
      (github.head_ref == 'dev/m4-model-tools-mcp' ||
       startsWith(github.head_ref, 'fix/auto02-') ||
       startsWith(github.head_ref, 'feat/auto02-') ||
       github.head_ref == 'work/tech02/workflow-supply-chain-convergence')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OLLAMA_VERSION: "0.32.14"
      OLLAMA_LINUX_AMD64_SHA256: c620917a71e146ab3a7f893084f066069c4c65d144ef8379a91c3cbe8b27de8f
      NIKA_OLLAMA_PROOF_MODEL: nika-ci-smollm2-q5km
      NIKA_OLLAMA_PROOF_MODEL_SHA256: 731d0c9cf598dada9712242ceddcca88aa0502fc8f9b8f773917df9f9113463a
      NIKA_OLLAMA_PROOF_MODEL_URL: https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/be21a1bc2b344d5b57381053d1dc0faea5f4e40c/SmolLM2-135M-Instruct-Q5_K_M.gguf?download=true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.NIKA_CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify exact candidate checkout identity
        run: python scripts/qa_assert_checkout_identity.py
      - name: Install Nika M4 dependencies
        run: python -m pip install -e ".[agent]"
      - name: Install exact Ollama release with checksum verification
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/ollama-linux-amd64.tar.zst
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst" \
            --output "$archive"
          printf '%s  %s\n' "$OLLAMA_LINUX_AMD64_SHA256" "$archive" | sha256sum --check -
          mkdir -p "$HOME/.local"
          tar --zstd -xf "$archive" -C "$HOME/.local"
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Start Ollama and import checksum-bound compact model
        shell: bash
        run: |
          set -euo pipefail
          ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:11434/api/version > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/ollama.log
              exit 1
            fi
            sleep 1
          done
          model_path=/tmp/SmolLM2-135M-Instruct-Q5_K_M.gguf
          curl --fail --location --silent --show-error --retry 3 \
            "$NIKA_OLLAMA_PROOF_MODEL_URL" --output "$model_path"
          printf '%s  %s\n' "$NIKA_OLLAMA_PROOF_MODEL_SHA256" "$model_path" | sha256sum --check -
          printf 'FROM %s\nLICENSE Apache-2.0\n' "$model_path" > /tmp/NikaCoreOllamaProof.Modelfile
          ollama create "$NIKA_OLLAMA_PROOF_MODEL" -f /tmp/NikaCoreOllamaProof.Modelfile
      - name: Run Nika ModelGateway against live Ollama
        run: python scripts/m4_ollama_proof.py

  m5-packaged-webview2-uia:
    name: M5 packaged WebView2 UIA proof
    if: github.event_name == 'pull_request' && github.head_ref == 'dev/m5-accessible-ui'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.NIKA_CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify exact candidate checkout identity
        run: python scripts/qa_assert_checkout_identity.py
      - name: Install M5 GUI and packaging dependencies
        run: python -m pip install -e ".[gui,qa]"
      - name: Build diagnostic one-dir Windows candidate
        shell: pwsh
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name NikaCoreM5Proof
          --add-data "src/nika_core/ui/web;nika_core/ui/web"
          scripts/m5_ui_proof.py
      - name: Verify packaged WebView2 UI Automation descendants
        shell: pwsh
        run: ./scripts/m5_uia_proof.ps1 -ExePath ./dist/NikaCoreM5Proof/NikaCoreM5Proof.exe

  m9-live-playwright-semantic-proof:
    name: M9 live Playwright semantic proof
    if: >-
      github.event_name == 'pull_request' &&
      (github.head_ref == 'dev/m9-real-adapter-proofs' ||
       github.head_ref == 'dev/dev04-playwright-semantic-vertical')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.NIKA_CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify exact candidate checkout identity
        run: python scripts/qa_assert_checkout_identity.py
      - name: Install M9 browser adapter
        run: python -m pip install -e ".[browser]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Prove semantic DOM accessibility snapshot through Nika adapter
        run: python scripts/m9_browser_adapter_proof.py

  m9-live-windows-uia-proof:
    name: M9 live Windows UIA semantic proof
    if: github.event_name == 'pull_request' && github.head_ref == 'dev/m9-real-adapter-proofs'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.NIKA_CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify exact candidate checkout identity
        run: python scripts/qa_assert_checkout_identity.py
      - name: Install M9 Windows UIA adapter
        run: python -m pip install -e ".[windows-interaction]"
      - name: Prove UIA semantic tree through Nika adapter
        run: python scripts/m9_windows_uia_proof.py
