name: Cheap Core CI

on:
  push:
    branches: [main, "dev/**", "feature/**", "fix/**", "integration/**", "bootstrap/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install cheap test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Compile
        run: python -m compileall -q src
      - name: Tests
        run: pytest
