name: DEV04 Windows UIA Physical Proof

on:
  pull_request:
    paths:
      - "src/nika_core/interaction/**"
      - "scripts/dev04_windows_uia_proof.py"
      - "scripts/fixtures/dev04_uia_winforms_fixture.ps1"
      - "tests/test_interaction_windows_uia_adapter.py"
      - "tests/test_interaction_pywinauto_identity.py"
      - "tests/test_interaction_windows_uia_action_authority.py"
      - ".github/workflows/dev04-windows-uia-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NIKA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: dev04-uia-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  physical-windows-uia:
    name: Strict WinForms UIA identity/focus/pattern proof
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.NIKA_CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify exact candidate checkout identity
        run: python scripts/qa_assert_checkout_identity.py
      - name: Install exact Windows interaction candidate
        run: python -m pip install -e ".[dev,windows-interaction]"
      - name: Run strict deterministic UIA authority regressions
        run: >-
          python -m pytest -q
          tests/test_interaction_windows_uia_adapter.py
          tests/test_interaction_pywinauto_identity.py
          tests/test_interaction_windows_uia_action_authority.py
      - name: Run live WinForms semantic UIA proof
        run: python scripts/dev04_windows_uia_proof.py
