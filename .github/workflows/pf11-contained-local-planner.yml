name: PF11 Contained Local ModelGateway Planner

on:
  pull_request:
    paths:
      - "src/nika_core/product_factory_local_coding_planner.py"
      - "src/nika_core/product_factory_local_model_program.py"
      - "tests/test_product_factory_local_coding_planner.py"
      - "tests/test_product_factory_local_model_program.py"
      - ".github/workflows/pf11-contained-local-planner.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NIKA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: pf11-contained-local-planner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  planner:
    name: Planner authority (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.NIKA_CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify exact candidate checkout identity
        run: python scripts/qa_assert_checkout_identity.py
      - name: Install focused qualification dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Lint contained-local planner slice
        run: >-
          python -m ruff check
          src/nika_core/product_factory_local_coding_planner.py
          src/nika_core/product_factory_local_model_program.py
          tests/test_product_factory_local_coding_planner.py
          tests/test_product_factory_local_model_program.py
      - name: Run contained-local planner regressions
        run: >-
          python -m pytest
          tests/test_product_factory_local_coding_planner.py
          tests/test_product_factory_local_model_program.py
          -q
