name: One-shot Loop-B credential alias repair

on:
  push:
    branches:
      - work/closer/loop-b-credential-alias-repair-20260929

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded canonical-key repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/nika_core/learning/study_queue.py")
          text = path.read_text(encoding="utf-8")
          wanted = ('        "subscriptionkey",\n', '        "xapikey",\n')
          missing = [entry for entry in wanted if entry not in text]
          if missing:
              anchor = '        "apikey",\n'
              if anchor not in text:
                  raise SystemExit("canonical _SECRET_QUERY_KEYS anchor not found; refusing blind patch")
              text = text.replace(anchor, anchor + "".join(missing), 1)
              path.write_text(text, encoding="utf-8")
          PY
          git rm .github/workflows/one-shot-loop-b-credential-alias-repair.yml
          python -m compileall -q src/nika_core/learning/study_queue.py
          git diff --check
      - name: Commit repaired tree
        shell: bash
        run: |
          git config user.name "Nika Core autonomous implementer"
          git config user.email "actions@users.noreply.github.com"
          git add src/nika_core/learning/study_queue.py .github/workflows/one-shot-loop-b-credential-alias-repair.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Learning: reject subscription and x-api key source aliases"
          git push origin "HEAD:${GITHUB_REF_NAME}"
